<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Public Land Voting Tool</title>
<meta name="description" content="A public record of what people want for Cleveland's city-owned vacant land. Vote on any lot; votes cast at the lot drive the map.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='11' height='11' fill='%2300875F'/%3E%3Crect x='17' y='4' width='11' height='11' fill='%230068A6'/%3E%3Crect x='4' y='17' width='11' height='11' fill='%23E6A200'/%3E%3Crect x='17' y='17' width='11' height='11' fill='%23C9C7C2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://services3.arcgis.com" crossorigin>
<style>
:root{
  --ink:#1D1A26; --muted:#67646C; --line:#DCDAD6; --mist:#F3F2F0; --paper:#FFFFFF;
  --danger:#9E2F2A;
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card:16px; --r-ctl:11px;
  --shadow:0 1px 2px rgba(29,26,38,.07), 0 10px 30px rgba(29,26,38,.11);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--mist);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.sw.h{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 5px)!important;box-shadow:inset 0 0 0 1.5px var(--c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:44px;padding:0 16px;border-radius:var(--r-ctl);
  border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#bbb8b2}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-dark:hover{border-color:var(--ink)}
.btn-sm{min-height:38px;font-size:14px;padding:0 12px}

/* ---------- the map ---------- */
#map{position:fixed;inset:0;background:#fff}
.maplibregl-ctrl-attrib{font-size:10.5px}
.dock{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.dock>*{pointer-events:auto;width:100%;max-width:440px}

/* the bar: choices, your/everyone toggle, more */
.vbar{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:7px}
.sq{flex:1 1 0;min-width:0;height:52px;border:0;border-radius:12px;background:var(--c);color:#fff;font-size:13px;font-weight:650;line-height:1.1;
  display:grid;place-items:center;padding:0 4px;text-align:center;position:relative;text-shadow:0 1px 1px rgba(0,0,0,.2);
  opacity:.4;filter:saturate(.75);transition:opacity .18s,filter .18s,transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.vbar.lit .sq{opacity:1;filter:none}
.vbar.lit .sq:active{transform:scale(.95)}
.vbar.lit .sq.cur{box-shadow:0 0 0 2.5px var(--paper),0 0 0 5px var(--ink);transform:translateY(-1px)}
.sq.cur::after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#fff}
.sq.busy{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.7}}
@media (max-width:420px){.vbar{gap:5px;padding:6px}.sq{font-size:12px;padding:0 2px;letter-spacing:-.01em}.ib{width:38px}}
.ib{flex:none;width:42px;height:52px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink);-webkit-tap-highlight-color:transparent}
.ib:hover,.ib[aria-expanded="true"]{background:var(--mist)}
.ib[aria-pressed="true"]{background:var(--ink);color:#fff}
.ib svg{width:23px;height:23px}
.shake{animation:shake .36s ease-in-out}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:6px}60%{translate:-4px}80%{translate:3px}}

/* the open lot: a strip above the bar on phones, a panel on wide screens */
.card{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:11px 12px 12px 14px;
  max-height:calc(100dvh - 190px);overflow:auto;overscroll-behavior:contain}
.card.in{animation:cardIn .2s ease-out}
@keyframes cardIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.ch{display:flex;align-items:flex-start;gap:10px}
.ct{flex:1;min-width:0}
.ct b{display:block;font-size:16.5px;line-height:1.25;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct .pin{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nx{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:var(--mist);display:grid;place-items:center;color:var(--ink)}
.nx:hover{background:#e8e6e2}
.nx svg{width:20px;height:20px}
.ct .place{font-size:13px;color:var(--muted);margin-top:1px}
.counts{margin-top:9px;font-size:14px;display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;align-items:baseline}
.counts .k{color:var(--muted);font-size:13px}
.counts .k.dec{color:var(--ink);font-weight:650}
.counts .off{opacity:.42}
.counts .v{min-width:0}
.counts .v span{white-space:nowrap}
.counts .v .sw{vertical-align:-1px;margin-right:4px}
.counts .none{color:#a19da6}
.card .note{font-size:12.5px;color:var(--muted);margin-top:6px}
.timing{margin-top:7px;font-size:13.5px;display:flex;gap:12px;align-items:baseline}
.timing .k{color:var(--muted);font-size:13px;flex:none}
.mine{margin-top:6px;font-size:14px;display:flex;align-items:center;gap:7px;min-height:20px}
.mine b{font-weight:650}
.cx,.fold{border-top:1px solid var(--mist);margin-top:9px;padding-top:7px;font-size:13.5px}
.cx summary,.fold summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:3px 0}
.fold+.cx{margin-top:4px}
.fold .counts{margin-top:6px}
/* the headline result and where you are, at the top of the card */
.lead{margin-top:9px;font-size:15px;display:flex;align-items:center;gap:8px}
.lead b{font-weight:650}
.lead .sw{width:13px;height:13px}
.lead.none{color:#a19da6;font-size:14px}
.near{margin-top:6px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:20px}
.near .dot{width:9px;height:9px;border-radius:50%;background:#B5B2AD;flex:none;margin:0 2px}
.near .dot.on{background:#2F6FEB;box-shadow:0 0 0 3px rgba(47,111,235,.18)}
.near b{color:var(--ink);font-weight:600}
dl.city{display:grid;grid-template-columns:minmax(110px,42%) 1fr;gap:4px 10px;margin:6px 0 0;font-size:13px}
dl.city dt{color:var(--muted)}
dl.city dd{margin:0;word-break:break-word}
dl.city dd.blank{color:#a19da6;font-style:italic}
@media (min-width:900px){
  .card{position:fixed;left:20px;top:76px;width:360px;max-width:none;max-height:calc(100dvh - 96px)}
  .card.in{animation-name:cardInSide}
  .maplibregl-ctrl-top-left{top:auto;bottom:0}
}
@keyframes cardInSide{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}

/* sheets above the bar: More, the location note, the card-switch question */
.sheet{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:6px;font-size:14.5px;
  max-height:calc(100dvh - 120px);overflow:auto;animation:cardIn .16s ease-out}
.sheet .pad{padding:10px 10px 8px}
.sheet p{margin:0 0 10px;line-height:1.4}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.key{display:grid;gap:5px;padding:10px 10px 12px;border-bottom:1px solid var(--mist);font-size:13.5px}
.key .ks{display:flex;flex-wrap:wrap;gap:4px 14px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key .muted{font-size:13px}
.filt{padding:10px 10px 12px;border-bottom:1px solid var(--mist)}
.filt .fh{font-weight:600;font-size:14px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:34px;padding:0 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:13.5px;font-weight:550}
.chips button:hover{border-color:#bbb8b2}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.filt .fhint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.35}
.dl{margin-top:12px}
.dl h2{margin:0 0 6px!important}
.dl p{font-size:14.5px;color:var(--muted)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:0 10px;border:0;border-radius:10px;background:none;
  text-align:left;text-decoration:none;font-weight:550;color:var(--ink)}
button.mrow:hover{background:var(--mist)}

.locate{position:fixed;z-index:9;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:14px;border:0;
  background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.locate svg{width:21px;height:21px}
.locate.on{color:#2F6FEB}
@media (min-width:900px){.locate{right:20px;top:auto;bottom:20px}}

/* what the map shows: a row above the bar on phones, a panel at the top right on wide screens */
.vrow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:3px 2px 5px;margin:-3px 0 -5px}
.vrow::-webkit-scrollbar{display:none}
.vrow .chips{flex-wrap:nowrap;gap:6px}
.vrow .chips button{flex:none;border-color:transparent;box-shadow:var(--shadow)}
.vrow .chips button[aria-pressed="true"]{border-color:var(--ink)}
.vrow .gfchip{flex:none;display:inline-flex;align-items:center;min-height:34px;padding:0 4px 0 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:550;box-shadow:var(--shadow)}
.vrow .gfchip button{border:0;background:none;color:#fff;width:30px;min-height:30px;display:grid;place-items:center;border-radius:999px}
.vrow .gfchip svg{width:14px;height:14px}
.seg{display:inline-flex;flex:none;background:var(--paper);border-radius:999px;box-shadow:var(--shadow);padding:3px}
.seg button{border:0;background:none;min-height:30px;padding:0 13px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.vpanel{display:none}
@media (min-width:900px){
  .vrow{display:none!important}
  .vpanel{display:block;position:fixed;z-index:9;right:20px;top:20px;width:290px;background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:12px 14px 14px}
  .vpanel .seg{display:flex;box-shadow:none;background:var(--mist)}
  .vpanel .seg button{flex:1}
  .vpanel .fh{font-weight:600;font-size:14px;margin:14px 0 8px}
  .vpanel .fhint{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.35}
  .vpanel .gon{flex-wrap:wrap;row-gap:6px}
  .vpanel .gon b{white-space:nowrap}
}

/* search: addresses and parcel numbers, from the lots already loaded */
.search{position:fixed;z-index:12;left:12px;right:68px;top:calc(env(safe-area-inset-top,0px) + 12px)}
.search form{position:relative;margin:0}
.search .si{position:absolute;left:13px;top:12px;width:20px;height:20px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;border:0;border-radius:14px;background:var(--paper);box-shadow:var(--shadow);padding:0 40px 0 41px;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:2.5px solid var(--ink);outline-offset:0}
.search .sx{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;border-radius:10px;background:none;display:grid;place-items:center;color:var(--muted)}
.search .sx svg{width:17px;height:17px}
.sres{margin-top:6px;background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:5px;max-height:min(360px,calc(100dvh - 140px));overflow:auto}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:8px 10px;font-size:14.5px;line-height:1.3}
.sres button:hover,.sres button.hi{background:var(--mist)}
.sres button span{display:block;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sres p{margin:0;padding:9px 10px;font-size:14px;color:var(--muted)}
@media (min-width:900px){.search{left:20px;right:auto;top:20px;width:360px}}

/* after the first vote: save your voter card. Never blocks the map. */
.nudge{position:fixed;z-index:30;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--paper);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:12px 10px 12px 14px;display:flex;gap:10px;align-items:flex-start;animation:nudgeIn .25s ease-out}
.nudge p{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.nudge p b{display:block;color:var(--ink);font-size:15px;font-weight:650;margin-bottom:1px}
.nudge .acts{margin-top:10px}
@keyframes nudgeIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:900px){.nudge{left:50%;right:auto;width:420px;translate:-50% 0}}

/* first visit */
.wel h2{font-size:19px;letter-spacing:-.01em;margin:0 0 6px;line-height:1.25}
.wel .steps{margin:10px 0 12px;padding:0;list-style:none;counter-reset:st;display:grid;gap:7px}
.wel .steps li{counter-increment:st;display:flex;gap:10px;align-items:baseline}
.wel .steps li::before{content:counter(st);flex:none;width:22px;height:22px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-size:12.5px;font-weight:650;color:var(--muted);position:relative;top:-1px}
.wel .wloc{background:var(--mist);border-radius:12px;padding:12px 12px 12px}
.wel .wloc p{margin:0 0 10px}
.wel .wfoot{margin:10px 0 0;font-size:14px}
.zhint{position:fixed;z-index:11;left:50%;bottom:calc(var(--dock-h,80px) + 14px);transform:translate(-50%,6px);background:rgba(29,26,38,.86);color:#fff;
  border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.zhint.show{opacity:1;transform:translate(-50%,0)}
.toast{position:fixed;z-index:800;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;max-width:min(420px,calc(100% - 24px));width:max-content;
  background:var(--danger);color:#fff;border-radius:12px;padding:11px 16px;font-size:14.5px;line-height:1.3;box-shadow:0 8px 24px rgba(29,26,38,.25);
  transition:opacity .18s,transform .18s;top:calc(env(safe-area-inset-top,0px) + 14px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* full pages over the map: your voter card, how votes count */
.page{position:fixed;z-index:50;inset:0;background:var(--mist);overflow:auto;-webkit-overflow-scrolling:touch}
.page .in{max-width:620px;margin:0 auto;padding:18px 18px 60px}
.page .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.page h1{font-size:24px;letter-spacing:-.015em;margin:0}
.page h2{font-size:17px;margin:26px 0 8px;letter-spacing:-.005em}
.page p,.page li{max-width:62ch}
.page p{margin:0 0 10px}
.page ul{margin:0 0 10px;padding-left:20px}
.page li{margin-bottom:5px}
.panel{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px}
.vc{text-align:center}
.vc .qr{width:min(260px,70vw);aspect-ratio:1;margin:4px auto 14px;display:grid;place-items:center}
.vc .qr svg{width:100%;height:100%;display:block}
.vc .btn{min-width:180px}
.vc p{margin:14px auto 0;font-size:14.5px;color:var(--muted)}
.vc .link{margin-top:10px;font-size:12.5px;color:var(--muted);word-break:break-all;font-variant-numeric:tabular-nums}

/* the group chip above the bar */
.gchip{display:flex;justify-content:flex-start}
.gchip .gc{display:inline-flex;align-items:center;background:var(--paper);border-radius:999px;box-shadow:var(--shadow);font-size:13.5px;min-height:36px;padding:0 4px 0 13px;gap:2px}
.gchip .gc button{border:0;background:none;padding:0;min-height:36px;display:inline-flex;align-items:center}
.gchip .gc b{font-weight:650;letter-spacing:.01em;margin-left:4px}
.gchip .gc .gx{width:34px;justify-content:center;border-radius:999px;color:var(--muted)}
.gchip .gc .gx:hover{background:var(--mist);color:var(--ink)}
.gchip .gc .gx svg{width:15px;height:15px}
/* group field in Show votes cast, and the group code forms */
.gform{display:flex;gap:6px;margin-top:10px;align-items:center}
.gform input{flex:1;min-width:0;min-height:38px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-size:14px;text-transform:uppercase;background:var(--paper)}
.gform input::placeholder{text-transform:none}
.gform input:focus{outline:none;border-color:var(--ink)}
.gmsg{font-size:12.5px;color:var(--danger);margin-top:6px}
.gmsg:empty{display:none}
.gon{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.gon b{font-weight:650}
.code{font-size:clamp(26px,8vw,38px);font-weight:700;letter-spacing:.02em;margin:2px 0 14px;word-break:break-all}
.vc .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.vc .acts .btn{min-width:0}
/* Why? (no location) */
.why{border:0;background:none;padding:0;font-size:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:2px;font-weight:550}
.sheet .wh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sheet .wh p{margin-top:4px}
.sheet .path{font-size:13.5px;color:var(--muted)}
.sheet .found{color:#0B6B47;font-weight:600}
.wqr{display:flex;gap:12px;align-items:center;border-top:1px solid var(--mist);margin-top:10px;padding-top:10px}
.wqr .qr{width:112px;height:112px;flex:none;display:grid;place-items:center}
.wqr .qr svg{width:100%;height:100%;display:block}
.wqr p{font-size:13.5px;margin:0 0 6px}
.wqr p.muted{font-size:12.5px;margin:0}
.boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);z-index:60;background:var(--mist)}
.boot b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Map of the city's land bank lots"></div>
<button class="locate" data-locate aria-label="Center the map on me" hidden></button>
<div class="search" data-search hidden>
  <form role="search" data-search-form autocomplete="off">
    <svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
    <input type="search" data-search-in placeholder="Search an address or parcel" aria-label="Search an address or parcel number" enterkeyhint="search" spellcheck="false" autocapitalize="off" aria-controls="sres" aria-expanded="false">
    <button type="button" class="sx" data-search-clear aria-label="Clear the search" hidden></button>
  </form>
  <div class="sres" id="sres" data-sres hidden></div>
</div>
<div class="vpanel" data-vpanel aria-label="What the map shows"></div>
<div class="nudge" data-nudge role="status" hidden></div>
<div class="zhint" data-zhint role="status"></div>
<div class="dock" data-dock hidden>
  <section class="card" data-card hidden aria-label="Selected lot"></section>
  <div class="sheet" data-sheet hidden></div>
  <div class="gchip" data-gchip hidden></div>
  <div class="vrow" data-vrow aria-label="What the map shows"></div>

  const before = S.mine.get(id) || null;

  const group = S.group;

/* search: addresses and parcel numbers, matched in the page against the lots already loaded (no geocoder,
   nothing sent anywhere). "1234 e 79" finds "1234 E 79th St"; "105-12-034" or "10512" finds parcels. */
const ABBR = { east: "e", west: "w", north: "n", south: "s", street: "st", avenue: "ave", av: "ave", road: "rd", drive: "dr", place: "pl",
  court: "ct", boulevard: "blvd", lane: "ln", parkway: "pkwy", terrace: "ter", square: "sq" };
const words = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").split(" ").filter(Boolean).map(w => ABBR[w] || w.replace(/^(\d+)(st|nd|rd|th)$/, "$1"));

function buildSearch() {
  SEARCH = S.fc.features.map(f => { const p = f.properties; return { id: p.id, a: p.a, d: p.d, w: words(p.a), near: /^(Next to|Near|Lot on|Parcel) /.test(p.a) }; });
}
function searchLots(q) {
  const pin = normId(q), qw = words(q), out = [];
  if (!pin) return out;
  for (const it of SEARCH) {
    let score = null;
    if (pin.length >= 3 && /\d/.test(pin) && it.id.startsWith(pin)) score = 0;
    else if (qw.length && qw.every(w => it.w.some(x => x.startsWith(w)))) {
      const inOrder = qw.every((w, i) => it.w[i]?.startsWith(w));
      score = (inOrder ? 1 : 2) + (it.near ? 2 : 0);
    }
    if (score !== null) out.push([score, it]);

}

  if (!q || document.activeElement !== inp) { box.hidden = true; inp.setAttribute("aria-expanded", "false"); return; }
  searchHits = searchLots(q); searchHi = Math.min(searchHi, Math.max(0, searchHits.length - 1));

  x.fillStyle = "#1D1A26";

  x.font = F(500, 17); x.fillText("Scan it or open the link to get your votes", W / 2, 586); x.fillText("back on any device.", W / 2, 611);

  x.fillStyle = "#1D1A26"; x.font = F(650, 17); x.fillText("Anyone with it can vote as you.", W / 2, 744);

}

      const yes = e.target.closest("[data-sw-yes]"), no = e.target.closest("[data-sw-no]");
      if (!yes && !no) return;
      s.onclick = null; closeSheet(); done(!!yes);
    };
  });
}

/* pages over the map */
function closePage() { S.page = null; const p = $("[data-page]"); p.hidden = true; p.innerHTML = ""; drawCard(); rowVis(); if (location.hash) history.replaceState(history.state, "", location.href.split("#")[0]); }
function pageTop(title) { return `<div class="top"><h1>${esc(title)}</h1><button class="nx" data-close-page aria-label="Back to the map">${ICON.close}</button></div>`; }
let qrP = null;
function loadQr() {
  return qrP ||= new Promise((ok, no) => {
    if (window.qrcode) return ok(window.qrcode);
    const s = document.createElement("script"); s.src = CONFIG.qrScript; s.onload = () => ok(window.qrcode); s.onerror = () => { qrP = null; no(new Error("QR code library didn't load")); };
    document.head.appendChild(s);
  });
}
async function qrSvg(text) {
  const qrcode = await loadQr(), q = qrcode(0, "M"); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    const t = Object.assign(document.createElement("textarea"), { value: text }); t.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(t); t.select(); const ok = document.execCommand("copy"); t.remove(); return ok;
  } catch { return false; }
}
async function openCard() {
  S.page = "card"; select(null); closeSheet(); hideNudge(); ls.set(NUDGE_KEY, "seen-card");
  const p = $("[data-page]"), link = cardLink();
  p.innerHTML = `<div class="in">${pageTop("Your voter card")}<div class="panel vc">
    <div class="qr" data-qr aria-label="QR code of your voter card link" role="img"></div>
    <div class="acts"><button class="btn btn-dark" data-copy>Copy link</button><button class="btn" data-save-card>Save image</button></div>
    <p>Save this link or the image to get your votes back on any device. Anyone with it can vote as you.</p>
    <div class="link">${esc(link)}</div></div></div>`;
  p.hidden = false; p.scrollTop = 0; drawCard();
  try { $("[data-qr]", p).innerHTML = await qrSvg(link); } catch { $("[data-qr]", p).innerHTML = `<span class="muted">The code didn't load. The link below works the same way.</span>`; }
}
function openHow() {
  S.page = "how"; select(null); closeSheet();
  const p = $("[data-page]");
  p.innerHTML = `<div class="in">${pageTop("How votes count")}
    <h2>What happens when you vote</h2>
    <p>Anyone can vote on any lot. There's no sign-up and no limit. Instead of checking who you are, we record how each vote was cast. Then anyone looking at the results can see what kind of votes are behind them.</p>
    <h2>What we record with each vote</h2>
    <p>Your choice and the lot. How far you were from the lot, rounded, and whether you were in the lot's neighborhood and ward. We keep the distance, never where you were. Whether your device could find its location, or you chose not to share it. How fast you were moving. How long it had been since your previous vote. Whether you could see other people's votes when you voted. Whether you opened the city's record for the lot. Whether you used a phone or a computer, and whether you came from a printed card. Your group code, if you joined one. The date and time.</p>
    <h2>What we don't record</h2>
    <p>Your name, contact details, or location. Your votes are tied together by a random code saved on your device. Your voter card holds that code.</p>
    <h2>What we publish</h2>
    <p>Every vote, with how it was cast, so anyone can download the data. We leave out the code that ties a voter's votes together, the time of day, and group codes. Anyone with a group's code can download that group's votes the same way.</p>
    <h2>How votes count on the map</h2>
    <p>On every lot, the votes cast closest to it set its color. Votes without a location still count, but they come after every vote that has one. The record keeps whether a location was unavailable or turned down. Voting from a phone gives a location. Everything else is there to read, not to rank.</p>
    <h2>Groups</h2>
    <p>A group code helps a block club or coalition gather its votes and see them together. It doesn't change how any vote counts.</p>
    <h2>How others may use it</h2>
    <p>A city department, a council member, or a neighborhood group may decide some votes deserve more weight than others. For example, they might count only votes cast in the neighborhood, or leave out votes cast seconds apart. That's their choice, and anyone can check it against the same data. If someone tells you how people voted, ask them which votes they counted.</p>
  </div>`;
  p.hidden = false; p.scrollTop = 0; drawCard();
}
// Group: the device's group (large, with its link, QR code and Share), Start a group, Join a group.
async function openGroup(msg = "") {
  S.page = "group"; select(null); closeSheet();
  const p = $("[data-page]");
  p.innerHTML = `<div class="in">${pageTop("Group")}
    ${S.group ? `<div class="panel vc"><div class="code" data-code>${esc(S.group)}</div>
      <div class="qr" data-qr aria-label="QR code of the group link" role="img"></div>
      <div class="acts"><button class="btn btn-dark" data-group-copy>Copy link</button><button class="btn" data-group-share>Share</button></div>
      <p>Anyone with this code can join the group and see its votes.</p>
      <div class="link">${esc(groupLink())}</div></div>` : ""}
    <div class="panel dl"><h2>Start a group</h2>
      <p>A new code for a block club or coalition. Votes cast while it's on are gathered under it. It doesn't change how any vote counts.</p>
      <button class="btn btn-dark" data-group-start>Start a group</button></div>
    <div class="panel dl"><h2>Join a group</h2>
      <form class="gform" data-group-join><input name="code" placeholder="Group code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Group code">
        <button class="btn btn-dark btn-sm" type="submit">Join</button></form><div class="gmsg" role="status">${esc(msg)}</div></div>
  </div>`;
  p.hidden = false; p.scrollTop = 0; drawCard();
  if (S.group) { try { $("[data-qr]", p).innerHTML = await qrSvg(groupLink()); } catch { const q = $("[data-qr]", p); if (q) q.innerHTML = `<span class="muted">The code didn't load. The link below works the same way.</span>`; } }
}
async function startGroup(btn) {
  btn.disabled = true; btn.textContent = "Starting…";
  try {
    const d = await rpc("create_group", {});
    setGroup(d.code); pill(`Group ${d.code} on.`, 2200);
    if (S.page === "group") openGroup();
  } catch { toast("Couldn't start a group. Try again in a moment."); if (btn.isConnected) { btn.disabled = false; btn.textContent = "Start a group"; } }
}
async function joinGroup(form) {
  const code = normGroup(form.code.value), msg = $(".gmsg", form.parentElement), btn = $("button", form);
  if (!code) return;
  btn.disabled = true;
  try {
    if (await checkGroup(code)) { setGroup(code); pill(`Group ${code} on.`, 2200); return openGroup(); }
    msg.textContent = "No group with that code.";
  } catch { msg.textContent = "Couldn't reach the record. Try again in a moment."; }
  finally { if (btn.isConnected) btn.disabled = false; }
}
async function shareGroup() {
  const url = groupLink();
  if (navigator.share) {
    try { await navigator.share({ title: `Group ${S.group}`, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  pill(await copyText(url) ? "Group link copied" : "Couldn't copy the link", 2200);
}
function openData() {
  S.page = "data"; select(null); closeSheet();
  const p = $("[data-page]");
  p.innerHTML = `<div class="in">${pageTop("Download the data")}
    <p>The record is public. Anyone can download it as a spreadsheet (CSV). Neither file has voter IDs or times of day, so no one's votes can be pieced together into where they went.</p>
    <div class="panel dl"><h2>Votes by lot</h2>
      <p>One row per lot with votes: parcel, address, neighborhood, ward, and planning region; counts of each choice by where the votes were cast; the median time between votes, compared with every vote; and how the lot shows on the map.</p>
      <button class="btn btn-dark" data-dl="lots">Download votes by lot</button></div>
    <div class="panel dl"><h2>Every vote</h2>
      <p>One row per vote: the lot, the choice, where it was cast from, the distance in feet, the seconds since the voter's previous vote and how that compares with every vote, the date, how fast the voter was moving, whether everyone's votes were showing, the Show votes cast filter, whether the city's record for the lot was opened, and whether the voter's location was found. Each voter's current vote on a lot is included; earlier changes and cleared votes aren't. Group codes aren't included.</p>
      <button class="btn btn-dark" data-dl="votes">Download every vote</button></div>
    <div class="panel dl"><h2>Group code</h2>
      <p>The same two files, with only one group's votes.</p>
      <form class="gform" data-dl-group><input name="code" placeholder="Group code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Group code"></form>
      <div class="gmsg" role="status"></div>
      <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn btn-dark btn-sm" data-dl="lots" data-dl-g>Download votes by lot</button><button class="btn btn-dark btn-sm" data-dl="votes" data-dl-g>Download every vote</button></div></div>
  </div>`;
  p.hidden = false; p.scrollTop = 0; drawCard();
}
function downloadFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const csvCell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
const csv = rows => "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
const stamp = () => new Date().toLocaleDateString("en-CA");   // YYYY-MM-DD, local
const choiceWord = k => k === "tie" ? "tied" : k ? lower(k) : "";
const yesNo = v => v === true ? "yes" : v === false ? "no" : "";
async function download(kind, btn) {
  // A group's files: the code typed on the page, checked against the record.
  let group = null;
  if (btn.hasAttribute("data-dl-g")) {
    const box = btn.closest(".panel"), msg = $(".gmsg", box);
    group = normGroup($("input", box).value); msg.textContent = "";
    if (!group) { msg.textContent = "Type a group code first."; return; }
  }
  const was = btn.textContent; btn.textContent = "Preparing…"; btn.disabled = true;
  const tag = group ? `-${group}` : "";
  try {
    if (kind === "lots") {
      const d = group ? await rpc("export_group_lots", { code: group }) : await rpc("export_lots", {});
      const head = ["parcel", "address", "neighborhood", "ward", "planning_region", "total_votes",
        ...TIERS.flatMap(t => CHOICES.map(c => `${t.col}_${c.key}`)), "votes_with_timing", "median_seconds_since_voters_previous_vote", "median_longer_than_pct_of_votes",
        "closest_votes_cast", "leading_choice", "map_style"];
      const rows = d.map(r => [r.parcel, r.address, r.neighborhood, r.ward, r.region, sum(r.counts), ...r.counts, r.timed, r.median_seconds ?? "", r.median_pct ?? "",
        r.tier ? TK[r.tier].phrase() : "", choiceWord(r.lead), r.display || ""]);
      downloadFile(`public-land-votes-by-lot${tag}-${stamp()}.csv`, csv([head, ...rows]), "text/csv");
    } else {
      const d = group ? await rpc("export_group_votes", { code: group }) : await rpc("export_votes", {});
      const head = ["parcel", "address", "neighborhood", "ward", "planning_region", "choice", "cast_from", "distance_ft", "seconds_since_voters_previous_vote", "longer_than_pct_of_votes", "date",
        "moving_speed_mph", "everyone_votes_showing", "filter_at_cast", "city_record_opened", "location_status"];
      const rows = d.map(([pin, addr, nb, wd, rg, choice, tier, dist, secs, pct, date, mph, saw, filt, opened, status]) =>
        [pin, addr, nb, wd, rg, choiceWord(choice), TK[tier]?.phrase({ neighborhood: "the lot's neighborhood", ward: "the lot's ward" }) ?? tier, dist, secs, pct, date,
         mph ?? "", yesNo(saw), filt ?? "", yesNo(opened), status ?? ""]);
      downloadFile(`public-land-votes${tag}-${stamp()}.csv`, csv([head, ...rows]), "text/csv");
    }
  } catch (e) {
    if (e.code === "bad_group") { const m = $(".gmsg", btn.closest(".panel")); if (m) m.textContent = "No group with that code."; }
    else toast("The download didn't work. Try again in a moment.");
  }
  finally { if (btn.isConnected) { btn.textContent = was; btn.disabled = false; } }
}
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  if (h === "card") return openCard();
  if (h === "how") return openHow();
  if (h === "data") return openData();
  if (h === "group") return openGroup();
  if (S.page) closePage();
}

/* ----------------------------------------------------------------- events */
function wire() {
  document.addEventListener("click", e => {
    const t = e.target.closest("button, a"); if (!t) return;
    if (t.matches("[data-choice]")) return vote(t.dataset.choice);
    if (t.matches("[data-close]")) return select(null);
    if (t.matches("[data-more]")) return S.sheet === "more" ? closeSheet() : openMore();
    if (t.matches("[data-view]")) {
      if (t.dataset.view === S.view) return;
      S.view = t.dataset.view; $$("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view)); paint(); return;
    }
    if (t.matches("[data-lot]")) return goLot(t.dataset.lot);
    if (t.matches("[data-search-clear]")) return clearSearch();
    if (t.matches("[data-welcome-ok]")) return closeSheet();
    if (t.matches("[data-nudge-close]")) return hideNudge();
    if (t.matches("[data-save-card]")) return saveCardImage(t);
    if (t.matches("[data-go]")) { if (t.closest("[data-nudge]")) hideNudge(); location.hash = `#/${t.dataset.go}`; return; }
    if (t.matches("[data-close-page]")) return closePage();
    if (t.matches("[data-use-loc]")) { closeSheet(); return useLocFromMore(); }
    if (t.matches("[data-loc-yes]")) { ls.set(LOC_KEY, "asked"); closeSheet(); return startWatch(); }
    if (t.matches("[data-loc-no]")) { ls.set(LOC_KEY, "later"); whyOnFail = false; closeSheet(); return; }
    if (t.matches("[data-why]")) return openWhy();
    if (t.matches("[data-why-close]")) { closeSheet(); return drawCard(); }
    if (t.matches("[data-why-retry]")) { whyFound = false; restartWatch(); return drawWhy(); }
    if (t.matches("[data-group-off]")) { const g = S.group; setGroup(null); pill(`Group ${g} off`, 1600); return; }
    if (t.matches("[data-group-start]")) return startGroup(t);
    if (t.matches("[data-group-copy]")) { copyText(groupLink()).then(ok => { t.textContent = ok ? "Copied" : "Couldn't copy"; setTimeout(() => { if (t.isConnected) t.textContent = "Copy link"; }, 2200); }); return; }
    if (t.matches("[data-group-share]")) return shareGroup();
    if (t.matches("[data-gfilter-off]")) return setGroupFilter(null);
    if (t.matches("[data-locate]")) return locClick();
    if (t.matches("[data-filter]")) return setFarthest(t.dataset.filter);
    if (t.matches("[data-share]")) { closeSheet(); return shareMap(); }
    if (t.matches("[data-dl]")) return download(t.dataset.dl, t);
    if (t.matches("[data-copy]")) {
      copyText(cardLink()).then(ok => { t.textContent = ok ? "Copied" : "Couldn't copy: select the link below"; setTimeout(() => { if (t.isConnected) t.textContent = "Copy link"; }, 2200); });
    }
  });
  document.addEventListener("submit", e => {
    const f = e.target; e.preventDefault();
    if (f.matches("[data-search-form]")) { const h = searchHits[searchHi]; if (h && !$("[data-sres]").hidden) goLot(h.id); return; }
    if (f.matches("[data-gfilter-form]")) return submitGroupFilter(f);
    if (f.matches("[data-group-join]")) return joinGroup(f);
  });
  // "City record" opened on this lot's card (toggle doesn't bubble, so listen on the way down)
  document.addEventListener("toggle", e => {
    if (e.target.matches?.("details.cx") && e.target.open && S.sel) S.openedRecord = true;
    if (e.target.matches?.("details[data-tally]")) S.tallyOpen = e.target.open;   // not the city record: doesn't count as opened_record
  }, true);
  // search: results as you type; arrows move, Enter goes, Esc clears
  const sin = $("[data-search-in]");
  sin.addEventListener("input", () => { searchHi = 0; drawSearch(); });
  sin.addEventListener("focus", drawSearch);
  sin.addEventListener("blur", () => setTimeout(drawSearch, 0));
  sin.addEventListener("keydown", e => {
    if (e.key === "Escape") { e.stopPropagation(); if (sin.value) { sin.value = ""; drawSearch(); } else sin.blur(); return; }
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && searchHits.length) { e.preventDefault(); searchHi = (searchHi + (e.key === "ArrowDown" ? 1 : searchHits.length - 1)) % searchHits.length; drawSearch(); }
  });
  $("[data-sres]").addEventListener("pointerdown", e => e.preventDefault());   // keep the field focused until the tap lands
  document.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") { if (S.page) return closePage(); if (S.sheet && S.sheet !== "switch") return closeSheet(); if (S.sel) return select(null); }
    if (!S.page && /^[1-3]$/.test(e.key) && S.sel) vote(CHOICES[+e.key - 1].key);
  });
  addEventListener("hashchange", route);
  addEventListener("resize", setDockH);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - tallyAt > CONFIG.refreshSeconds * 1000) Promise.all([refreshTallies(), refreshMine()]).then(() => { paint(); drawCard(); }).catch(() => {});
  });
}
async function locClick() {
  if (fix) return centerOnMe(false);
  if (locState === "denied" || (await locPermission()) === "denied") return toast("Location is off for this site. Turn it on in your browser's settings to vote on site.");
  if ((await locPermission()) === "granted") { centeredOnMe = false; return startWatch(); }
  openLocNote();
}

/* ------------------------------------------------------------------- boot */
async function boot() {
  // On load, in this order: read ?card and ?group; set arrived_via; adopt the card (asking first if this
  // device has votes under another ID); check and adopt the group; take both out of the address bar.
  loadVoter();
  const { card, group } = readParams();
  arrivedVia = card && card !== "bad" ? "card_link" : "direct";
  wire();
  let fc;
  try { fc = await loadParcels(); }
  catch (e) { $("[data-boot-msg]").textContent = `The city's lot list didn't load (${e.message}). Try again in a moment.`; return; }
  S.fc = fc; S.fields = fc.metadata.fields;
  let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
  for (const f of fc.features) { const p = f.properties; S.byId.set(p.id, f); x0 = Math.min(x0, p.cx); y0 = Math.min(y0, p.cy); x1 = Math.max(x1, p.cx); y1 = Math.max(y1, p.cy); }
  S.bounds = [[x0, y0], [x1, y1]];

  // A card link: adopt its ID. Ask first only if this device has votes under a different ID.
  if (card === "bad") toast("That voter card link isn't complete. Check the link and open it again.");
  else if (card && card !== voterId) {
    let mine = [];
    try { mine = await rpc("my_votes", { voter_id: voterId }); } catch {}
    $("[data-dock]").hidden = false; $("[data-boot]").hidden = true;
    drawBar();
    if (!mine.length || await askSwitch(card)) { setVoter(card); pill("Voter card loaded", 1800); ls.set(NUDGE_KEY, "came-with-card"); }
  }
  if (group !== null) {
    const code = normGroup(group);
    try {
      if (await checkGroup(code)) { setGroup(code); pill(`Group ${code} on.`, 2600); }
      else toast("That group link doesn't match any group. Check the link and open it again.");
    } catch { toast("Couldn't check the group link. Open it again in a moment."); }
  }
  stripParams();

  buildSearch();
  await initMap();
  $("[data-boot]").hidden = true; $("[data-dock]").hidden = false; $("[data-search]").hidden = false;
  drawView(); drawBar(); drawLocate();
  try { await Promise.all([refreshTallies(), refreshMine()]); } catch { toast("Couldn't reach the record. Votes will show when it's back."); }
  paint();
  startLive();
  route();

  // A card link on its own load counts as having the card: no nudge to save it.
  if (arrivedVia === "card_link") ls.set(NUDGE_KEY, "came-with-card");
  // First visit: the welcome sheet, which asks about location too. Someone who has voted or answered the location
  // question before has seen it. After that: already allowed -> start; never answered -> the one-sentence note;
  // declined -> leave it.
  const perm = hasGeo() ? await locPermission() : "unsupported";
  if (!hasGeo()) { locState = "unsupported"; drawLocate(); }
  else if (perm === "granted" || (perm !== "denied" && ls.get(LOC_KEY) === "asked")) startWatch();   // seen the note before: no need to repeat it
  else if (perm === "denied") { locState = "denied"; drawLocate(); }
  const free = !S.page && S.sheet !== "switch";
  if (!ls.get(WELCOME_KEY) && (S.mine.size || ls.get(LOC_KEY))) ls.set(WELCOME_KEY, true);
  if (!ls.get(WELCOME_KEY)) { if (free) openWelcome(perm); }
  else if (hasGeo() && perm !== "granted" && perm !== "denied" && !ls.get(LOC_KEY) && free) openLocNote();
}
boot();
