<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Public Land Voting Tool</title>
<meta name="description" content="A public record of what people want for Cleveland's city-owned vacant land. Vote on any lot; votes cast at the lot drive the map.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='11' height='11' fill='%2300875F'/%3E%3Crect x='17' y='4' width='11' height='11' fill='%230068A6'/%3E%3Crect x='4' y='17' width='11' height='11' fill='%23E6A200'/%3E%3Crect x='17' y='17' width='11' height='11' fill='%23C9C7C2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://services3.arcgis.com" crossorigin>
<style>
:root{
  --ink:#1D1A26; --muted:#67646C; --line:#DCDAD6; --mist:#F3F2F0; --paper:#FFFFFF;
  --danger:#9E2F2A;
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card:16px; --r-ctl:11px;
  --shadow:0 1px 2px rgba(29,26,38,.07), 0 10px 30px rgba(29,26,38,.11);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--mist);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.sw.h{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 5px)!important;box-shadow:inset 0 0 0 1.5px var(--c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:44px;padding:0 16px;border-radius:var(--r-ctl);
  border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#bbb8b2}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-dark:hover{border-color:var(--ink)}
.btn-sm{min-height:38px;font-size:14px;padding:0 12px}

/* ---------- the map ---------- */
#map{position:fixed;inset:0;background:#fff}
.maplibregl-ctrl-attrib{font-size:10.5px}
.dock{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.dock>*{pointer-events:auto;width:100%;max-width:440px}

/* the bar: choices, your/everyone toggle, more */
.vbar{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:7px}
.sq{flex:1 1 0;min-width:0;height:52px;border:0;border-radius:12px;background:var(--c);color:#fff;font-size:13px;font-weight:650;line-height:1.1;
  display:grid;place-items:center;padding:0 4px;text-align:center;position:relative;text-shadow:0 1px 1px rgba(0,0,0,.2);
  opacity:.4;filter:saturate(.75);transition:opacity .18s,filter .18s,transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.vbar.lit .sq{opacity:1;filter:none}
.vbar.lit .sq:active{transform:scale(.95)}
.vbar.lit .sq.cur{box-shadow:0 0 0 2.5px var(--paper),0 0 0 5px var(--ink);transform:translateY(-1px)}
.sq.cur::after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#fff}
.sq.busy{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.7}}
@media (max-width:420px){.vbar{gap:5px;padding:6px}.sq{font-size:12px;padding:0 2px;letter-spacing:-.01em}.ib{width:38px}}
.ib{flex:none;width:42px;height:52px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink);-webkit-tap-highlight-color:transparent}
.ib:hover,.ib[aria-expanded="true"]{background:var(--mist)}
.ib[aria-pressed="true"]{background:var(--ink);color:#fff}
.ib svg{width:23px;height:23px}
.shake{animation:shake .36s ease-in-out}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:6px}60%{translate:-4px}80%{translate:3px}}

/* the open lot: a strip above the bar on phones, a panel on wide screens */
.card{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:11px 12px 12px 14px;
  max-height:calc(100dvh - 190px);overflow:auto;overscroll-behavior:contain}
.card.in{animation:cardIn .2s ease-out}
@keyframes cardIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.ch{display:flex;align-items:flex-start;gap:10px}
.ct{flex:1;min-width:0}
.ct b{display:block;font-size:16.5px;line-height:1.25;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct .pin{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nx{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:var(--mist);display:grid;place-items:center;color:var(--ink)}
.nx:hover{background:#e8e6e2}
.nx svg{width:20px;height:20px}
.ct .place{font-size:13px;color:var(--muted);margin-top:1px}
.counts{margin-top:9px;font-size:14px;display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;align-items:baseline}
.counts .k{color:var(--muted);font-size:13px}
.counts .k.dec{color:var(--ink);font-weight:650}
.counts .off{opacity:.42}
.counts .v{min-width:0}
.counts .v span{white-space:nowrap}
.counts .v .sw{vertical-align:-1px;margin-right:4px}
.counts .none{color:#a19da6}
.card .note{font-size:12.5px;color:var(--muted);margin-top:6px}
.pace{margin-top:7px;font-size:13.5px;display:flex;gap:12px;align-items:baseline}
.pace .k{color:var(--muted);font-size:13px}
.mine{margin-top:6px;font-size:14px;display:flex;align-items:center;gap:7px;min-height:20px}
.mine b{font-weight:650}
.cx{border-top:1px solid var(--mist);margin-top:9px;padding-top:7px;font-size:13.5px}
.cx summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:3px 0}
dl.city{display:grid;grid-template-columns:minmax(110px,42%) 1fr;gap:4px 10px;margin:6px 0 0;font-size:13px}
dl.city dt{color:var(--muted)}
dl.city dd{margin:0;word-break:break-word}
dl.city dd.blank{color:#a19da6;font-style:italic}
@media (min-width:900px){
  .card{position:fixed;left:20px;top:20px;width:360px;max-width:none;max-height:calc(100dvh - 40px)}
  .card.in{animation-name:cardInSide}
  .maplibregl-ctrl-top-left{top:auto;bottom:0}
}
@keyframes cardInSide{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}

/* sheets above the bar: More, the location note, the card-switch question */
.sheet{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:6px;font-size:14.5px;
  max-height:calc(100dvh - 120px);overflow:auto;animation:cardIn .16s ease-out}
.sheet .pad{padding:10px 10px 8px}
.sheet p{margin:0 0 10px;line-height:1.4}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.key{display:grid;gap:5px;padding:10px 10px 12px;border-bottom:1px solid var(--mist);font-size:13.5px}
.key .ks{display:flex;flex-wrap:wrap;gap:4px 14px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key .muted{font-size:13px}
.filt{padding:10px 10px 12px;border-bottom:1px solid var(--mist)}
.filt .fh{font-weight:600;font-size:14px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:34px;padding:0 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:13.5px;font-weight:550}
.chips button:hover{border-color:#bbb8b2}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.filt .fhint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.35}
.dl{margin-top:12px}
.dl h2{margin:0 0 6px!important}
.dl p{font-size:14.5px;color:var(--muted)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:0 10px;border:0;border-radius:10px;background:none;
  text-align:left;text-decoration:none;font-weight:550;color:var(--ink)}
button.mrow:hover{background:var(--mist)}

.locate{position:fixed;z-index:9;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:14px;border:0;
  background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.locate svg{width:21px;height:21px}
.locate.on{color:#2F6FEB}
@media (min-width:900px){.locate{right:20px;top:20px}}
.zhint{position:fixed;z-index:11;left:50%;bottom:calc(var(--dock-h,80px) + 14px);transform:translate(-50%,6px);background:rgba(29,26,38,.86);color:#fff;
  border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.zhint.show{opacity:1;transform:translate(-50%,0)}
.toast{position:fixed;z-index:800;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;max-width:min(420px,calc(100% - 24px));width:max-content;
  background:var(--danger);color:#fff;border-radius:12px;padding:11px 16px;font-size:14.5px;line-height:1.3;box-shadow:0 8px 24px rgba(29,26,38,.25);
  transition:opacity .18s,transform .18s;top:calc(env(safe-area-inset-top,0px) + 14px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* full pages over the map: your voter card, how votes count */
.page{position:fixed;z-index:50;inset:0;background:var(--mist);overflow:auto;-webkit-overflow-scrolling:touch}
.page .in{max-width:620px;margin:0 auto;padding:18px 18px 60px}
.page .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.page h1{font-size:24px;letter-spacing:-.015em;margin:0}
.page h2{font-size:17px;margin:26px 0 8px;letter-spacing:-.005em}
.page p,.page li{max-width:62ch}
.page p{margin:0 0 10px}
.page ul{margin:0 0 10px;padding-left:20px}
.page li{margin-bottom:5px}
.panel{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px}
.vc{text-align:center}
.vc .qr{width:min(260px,70vw);aspect-ratio:1;margin:4px auto 14px;display:grid;place-items:center}
.vc .qr svg{width:100%;height:100%;display:block}
.vc .btn{min-width:180px}
.vc p{margin:14px auto 0;font-size:14.5px;color:var(--muted)}
.vc .link{margin-top:10px;font-size:12.5px;color:var(--muted);word-break:break-all;font-variant-numeric:tabular-nums}

.boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);z-index:60;background:var(--mist)}
.boot b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Map of the city's land bank lots"></div>
<button class="locate" data-locate aria-label="Center the map on me" hidden></button>
<div class="zhint" data-zhint role="status"></div>
<div class="dock" data-dock hidden>
  <section class="card" data-card hidden aria-label="Selected lot"></section>
  <div class="sheet" data-sheet hidden></div>
  <nav class="vbar" data-bar aria-label="Vote"></nav>
</div>
<div class="page" data-page hidden></div>
<div class="boot" data-boot><div><b>Public Land Voting Tool</b><span data-boot-msg>Loading the city's lots…</span></div></div>
<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";
/* =====================================================================
   Public Land Voting Tool (proximity version)

   One citywide map of the City of Cleveland's land bank lots. Anyone can
   vote on any lot: open space, development, or yard expansion. Each vote
   carries where it was cast from: within 200 ft of the lot, within 500 ft,
   inside the lot's neighborhood, inside its ward, elsewhere in the city,
   outside the city, or with no location. The database works that out from
   the voter's location and keeps only a rounded distance and two yes/no
   answers; coordinates are never stored.
     - On each lot, the votes cast closest to it set its color (the leading
       choice in the nearest group that has votes; a tie is grey).
     - Solid: that group is "at the lot". Hatched: it's farther away.
   "Show votes cast" narrows what the map shows; it never changes the record.
   Pace (time between a voter's votes) is shown on the lot's card and in the
   downloads; it doesn't change colors.

   The database (schema.sql) is reached only through six functions:
   cast_vote, lot_tallies, my_votes, lot_info, export_lots, export_votes.
   ===================================================================== */
const CONFIG = {
  parcelsUrl: "https://services3.arcgis.com/dty2kHktVXHrqO8i/arcgis/rest/services/City_Landbank/FeatureServer/0",
  idField: "parcelpin", addressField: "par_addr_all",
  imagery: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  imageryAttribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics",
  imageryOpacity: 0.5,       // 0 to 1: how strongly the aerial photo shows through the white background
  labels: "https://tiles.openfreemap.org/styles/positron",   // street names, drawn on top of the photo
  refreshSeconds: 20,        // how often the map picks up other people's votes
  selectZoom: 15,            // lots can be selected (and voted on) only at this zoom or closer
  meZoom: 17,                // zoom when the map opens on the voter
  qrScript: "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js",
  title: "Public Land Voting Tool",
  shareText: "What should Cleveland's city-owned vacant lots become? See what people want, and vote on any lot.",
  // The shared record. The publishable key is meant to be public; the database only allows six functions.
  supabaseUrl: "https://seqjjbvfeosqpmwmivkt.supabase.co",
  supabaseKey: "sb_publishable_Pzk-RIlE_EA6GRue4boSUg_lmtb4ZXc"
};
// Where a vote was cast from, nearest first. Same keys and order as vote_tier() in schema.sql; the 200 and
// 500 ft lines are set there. info = the lot's places from lot_info().
const TIERS = [
  { key: "lot",          name: () => "At the lot",             phrase: () => "at the lot",            col: "at_lot",            filter: "At the lot",          hint: "within 200 ft" },
  { key: "block",        name: () => "On the block",           phrase: () => "on the block",          col: "on_block",          filter: "On the block",        hint: "within 500 ft" },
  { key: "neighborhood", name: i => i?.neighborhood ? `In ${i.neighborhood}` : "In the neighborhood", phrase: i => i?.neighborhood ? `in ${i.neighborhood}` : "in the neighborhood",
                         col: "in_neighborhood", filter: "In the neighborhood", hint: "the lot's city neighborhood" },
  { key: "ward",         name: i => i?.ward ? `In ${i.ward}` : "In the ward", phrase: i => i?.ward ? `in ${i.ward}` : "in the ward",
                         col: "in_ward", filter: "In the ward", hint: "the lot's council ward" },
  { key: "city",         name: () => "Elsewhere in Cleveland", phrase: () => "elsewhere in Cleveland", col: "elsewhere_in_city", filter: "In Cleveland" },
  { key: "outside",      name: () => "Outside Cleveland",      phrase: () => "outside Cleveland",     col: "outside_city" },
  { key: "none",         name: () => "No location",            phrase: () => "no location",           col: "no_location" }
];
const TK = Object.fromEntries(TIERS.map((t, i) => [t.key, { ...t, rank: i + 1 }]));
const FILTERS = ["lot", "block", "neighborhood", "ward", "city", "all"];   // "Show votes cast" choices
const rankOf = k => k === "all" ? 7 : TK[k]?.rank ?? 7;
// Pace: time since the voter's previous vote. Same as vote_pace() in schema.sql.
const PACE = [
  { key: "rapid", label: "rapid", hint: "under 10 seconds after the voter's previous vote" },
  { key: "steady", label: "steady", hint: "10 seconds to 2 minutes" },
  { key: "unhurried", label: "unhurried", hint: "over 2 minutes, or the voter's first vote" }
];
// Distances in feet: "130 ft", "0.4 mi", "12 mi".
function fmtDist(ft) {
  if (ft < 1000) return `${fmt(Math.round(ft / 10) * 10)} ft`;
  const mi = ft / 5280;
  return `${mi < 10 ? mi.toFixed(1) : fmt(Math.round(mi))} mi`;
}
// The city's land bank programs. Keys are stored in the record; labels and colors can change.
// Colors are the previous tool's.
const CHOICES = [
  { key: "open_space", label: "Open space", color: "#00875F" },
  { key: "development", label: "Development", color: "#0068A6" },
  { key: "yard_expansion", label: "Yard expansion", color: "#E6A200" }
];
const TIE = { key: "tie", label: "Tied", color: "#8A8781" };
const CK = Object.fromEntries([...CHOICES, TIE].map(c => [c.key, c]));
const lower = k => CK[k].label.toLowerCase();

/* ---------------------------------------------------------------- helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => new Intl.NumberFormat().format(n);
const sum = a => a.reduce((x, y) => x + y, 0);
const normId = v => String(v ?? "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
const displayId = id => /^\d{8}$/.test(id) ? `${id.slice(0, 3)}-${id.slice(3, 5)}-${id.slice(5)}` : id;
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
const isWide = () => matchMedia("(min-width: 900px)").matches;
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let toastTimer = 0;
function toast(text, ms = 4500) {
  const el = $("#toast"); el.textContent = text;
  el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), ms);
}
let pillTimer = 0;
function pill(text, ms = 1800) {
  const el = $("[data-zhint]"); el.textContent = text; el.classList.add("show");
  clearTimeout(pillTimer); pillTimer = setTimeout(() => el.classList.remove("show"), ms);
}
function shake(el) { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
const ICON = {
  mine: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></svg>`,
  more: `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`,
  close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  locate: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7.2"/></svg>`,
  next: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`
};

/* ------------------------------------------------------- the record (RPC) */
// Always POST: the location goes in the body, never in a URL that could be logged.
async function rpc(fn, args) {
  const res = await fetch(`${CONFIG.supabaseUrl}/rest/v1/rpc/${fn}`, {
    method: "POST", headers: { apikey: CONFIG.supabaseKey, "Content-Type": "application/json" }, body: JSON.stringify(args)
  });
  if (!res.ok) throw new Error(`The record answered ${res.status}`);
  const d = await res.json();
  if (d && d.error) throw Object.assign(new Error(d.error), { code: d.error });
  return d;
}

/* ------------------------------------------------------------- identity
   A random voter ID, made on first visit and kept in this browser. No personal data.
   A card link (?card=<id>) carries an ID to another browser or back after clearing. */
const VOTER_KEY = "plvt:voter-id";
let voterId = null;
function loadVoter() {
  const v = ls.get(VOTER_KEY);

// City records -> what the map needs: id, label, center point, plus the city's own fields for the parcel card.
function buildParcels(raw) {

    const p = f.properties || {}, id = normId(p[CONFIG.idField]); if (!id || seen.has(id)) continue;
    seen.add(id);

    items.push({ addr: parseAddress(p[CONFIG.addressField]), f: { type: "Feature", geometry: g, properties: { id, d: displayId(String(p[CONFIG.idField]).trim()), a: "", cx: +cx.toFixed(6), cy: +cy.toFixed(6), city } } });
  }

  for (const it of items) if (it.addr?.full) { const k = gk(it.f.properties.cx, it.f.properties.cy); grid.has(k) ? grid.get(k).push(it) : grid.set(k, [it]); }

function titleCase(s) {

/* ----------------------------------------------------------------- voting
   Tap a choice: vote for it. Tap your current choice again: clear. Another choice: change.
   Shown at once; saved with the latest location fix. Saves on one lot go out in order. */
const pending = new Map();   // parcel -> { choice } waiting to be saved
const chains = new Map();    // parcel -> promise of the last save
function vote(key) {
  const id = S.sel;
  if (!id) { pill(gl && gl.getZoom() < CONFIG.selectZoom ? "Zoom in and tap a lot" : "Tap a lot first"); shake($("[data-bar]")); return; }
  const before = S.mine.get(id) || null;
  const choice = before && before.choice === key ? null : key;
  if (choice) S.mine.set(id, { choice, d: undefined, out: false, tier: null }); else S.mine.delete(id);
  pending.set(id, { choice });
  drawBar(); drawCard(); paint();
  const args = { voter_id: voterId, parcel_id: id, choice, ...fixArgs() };
  const run = (chains.get(id) || Promise.resolve()).then(() => rpc("cast_vote", args)).then(r => {
    if (pending.get(id)?.choice === choice) {
      pending.delete(id);
      if (r.choice) S.mine.set(id, { choice: r.choice, d: r.distance_ft ?? null, out: !!r.outside_city, tier: r.tier });
      else S.mine.delete(id);
    }
    return refreshTallies().catch(() => {});
  }, e => {
    if (pending.get(id)?.choice === choice) {
      pending.delete(id);
      if (before) S.mine.set(id, before); else S.mine.delete(id);
    }
    toast(e.code === "parcel_not_found" ? "The city no longer lists this lot." : "Your vote didn't save. Check your connection and try again.");
  }).finally(() => { if (chains.get(id) === run) chains.delete(id); drawBar(); drawCard(); paint(); });
  chains.set(id, run);
}

}

/* ----------------------------------------------------------------- events */
function wire() {
  document.addEventListener("click", e => {
    const t = e.target.closest("button, a"); if (!t) return;
    if (t.matches("[data-choice]")) return vote(t.dataset.choice);
    if (t.matches("[data-close]")) return select(null);
    if (t.matches("[data-more]")) return S.sheet === "more" ? closeSheet() : openMore();
    if (t.matches("[data-view]")) { S.view = S.view === "mine" ? "all" : "mine"; drawBar(); paint(); pill(S.view === "mine" ? "Your votes" : "Everyone's votes", 1200); return; }
    if (t.matches("[data-go]")) { location.hash = `#/${t.dataset.go}`; return; }
    if (t.matches("[data-close-page]")) return closePage();
    if (t.matches("[data-use-loc]")) { closeSheet(); return locClick(); }
    if (t.matches("[data-loc-yes]")) { ls.set(LOC_KEY, "asked"); closeSheet(); return startWatch(); }
    if (t.matches("[data-loc-no]")) { ls.set(LOC_KEY, "later"); closeSheet(); return; }
    if (t.matches("[data-locate]")) return locClick();
    if (t.matches("[data-filter]")) return setFarthest(t.dataset.filter);
    if (t.matches("[data-share]")) { closeSheet(); return shareMap(); }
    if (t.matches("[data-dl]")) return download(t.dataset.dl, t);
    if (t.matches("[data-copy]")) {
      copyText(cardLink()).then(ok => { t.textContent = ok ? "Copied" : "Couldn't copy: select the link below"; setTimeout(() => { if (t.isConnected) t.textContent = "Copy link"; }, 2200); });
    }
  });
  document.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") { if (S.page) return closePage(); if (S.sheet && S.sheet !== "switch") return closeSheet(); if (S.sel) return select(null); }
    if (!S.page && /^[1-3]$/.test(e.key) && S.sel) vote(CHOICES[+e.key - 1].key);
  });
  addEventListener("hashchange", route);
  addEventListener("resize", setDockH);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - tallyAt > CONFIG.refreshSeconds * 1000) Promise.all([refreshTallies(), refreshMine()]).then(() => { paint(); drawCard(); }).catch(() => {});
  });
}

  if ((await locPermission()) === "granted") { centeredOnMe = false; return startWatch(); }

  let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
  for (const f of fc.features) { const p = f.properties; S.byId.set(p.id, f); x0 = Math.min(x0, p.cx); y0 = Math.min(y0, p.cy); x1 = Math.max(x1, p.cx); y1 = Math.max(y1, p.cy); }
  S.bounds = [[x0, y0], [x1, y1]];

  // A card link: adopt its ID. Ask first only if this device has votes under a different ID.
  if (card === "bad") toast("That voter card link isn't complete. Check the link and open it again.");
  else if (card && card !== voterId) {
    let mine = [];
    try { mine = await rpc("my_votes", { voter_id: voterId }); } catch {}
    $("[data-dock]").hidden = false; $("[data-boot]").hidden = true;
    drawBar();
    if (!mine.length || await askSwitch(card)) { setVoter(card); pill("Voter card loaded", 1800); }
  }

  await initMap();
  $("[data-boot]").hidden = true; $("[data-dock]").hidden = false;
  drawBar(); drawLocate();
  try { await Promise.all([refreshTallies(), refreshMine()]); } catch { toast("Couldn't reach the record. Votes will show when it's back."); }
  paint();
  startLive();
  route();

  // Location: already allowed -> start; never answered -> the one-sentence note first; declined -> leave it.
  const perm = await locPermission();
  if (perm === "granted" || (perm !== "denied" && ls.get(LOC_KEY) === "asked")) startWatch();   // seen the note before: no need to repeat it
  else if (perm === "denied") { locState = "denied"; drawLocate(); }
  else if (ls.get(LOC_KEY) !== "later" && !S.page && S.sheet !== "switch") openLocNote();
}
boot();

</script>
